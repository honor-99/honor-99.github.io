<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0508">
<title>心动 · Heartbeat — a three.js particle heart</title>
<style>
  :root {
    --ink: #f2e9ee;
    --ink-dim: rgba(242, 233, 238, 0.62);
    --glass: rgba(255, 255, 255, 0.06);
    --glass-line: rgba(255, 255, 255, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0508;
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    opacity: 0;
    transition: opacity 1.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  body.ready { opacity: 1; }

  #stage { position: fixed; inset: 0; display: block; }
  canvas { display: block; }

  /* 屏幕空间辉光:心跳时整体提亮,颜色跟随配色 */
  #glow {
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 52% 46% at 50% 52%, var(--pulse, rgba(255, 46, 80, 0.20)) 0%, transparent 68%),
      radial-gradient(ellipse 130% 100% at 50% 118%, rgba(120, 10, 40, 0.16) 0%, transparent 55%);
    opacity: var(--beat-o, 0.25);
    transform: scale(var(--beat-s, 1));
    transition: opacity 90ms linear, transform 90ms linear, background 600ms ease;
    will-change: opacity, transform;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 118% 108% at 50% 50%, transparent 52%, rgba(2, 1, 3, 0.62) 100%);
  }

  /* ---------- HUD ---------- */
  .hud { position: fixed; z-index: 10; user-select: none; }

  #brand { top: clamp(14px, 3.2vh, 28px); left: clamp(16px, 3.4vw, 34px); }
  #brand h1 {
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-weight: 900;
    font-size: clamp(34px, 5.6vw, 58px);
    letter-spacing: 0.14em;
    line-height: 1.05;
    background: linear-gradient(115deg, #ffd9e4 8%, var(--c-hi, #ff5e86) 46%, var(--c-lo, #8a1030) 88%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 22px rgba(255, 46, 86, 0.30));
    transition: background 600ms ease;
  }
  #brand .en {
    margin-top: 6px;
    font-size: clamp(10px, 1.2vw, 12.5px);
    letter-spacing: 0.42em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  #actions { top: clamp(14px, 3.2vh, 28px); right: clamp(16px, 3.4vw, 34px); display: flex; gap: 8px; }
  .btn {
    appearance: none;
    border: 1px solid var(--glass-line);
    background: var(--glass);
    color: var(--ink);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.12s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.3); }
  .btn:active { transform: scale(0.94); }
  .btn.on { border-color: rgba(255, 120, 150, 0.55); background: rgba(255, 80, 110, 0.16); }

  #hint {
    bottom: clamp(14px, 3.2vh, 28px); left: clamp(16px, 3.4vw, 34px);
    font-size: 12px; letter-spacing: 0.1em; color: var(--ink-dim);
  }
  #hint b { color: var(--ink); font-weight: 600; }

  #stats {
    bottom: clamp(14px, 3.2vh, 28px); right: clamp(16px, 3.4vw, 34px);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  #stats .love {
    font-size: 13px; letter-spacing: 0.12em; color: var(--ink);
  }
  #stats .love .n { color: var(--c-hi, #ff5e86); font-weight: 700; transition: color 600ms ease; }
  #stats .meta {
    margin-top: 5px; font-size: 10.5px; letter-spacing: 0.14em;
    color: rgba(242, 233, 238, 0.4);
  }

  #fallback {
    position: fixed; inset: 0; display: none; place-items: center;
    text-align: center; padding: 24px; line-height: 1.8; color: var(--ink-dim);
  }

  @media (max-width: 640px) {
    #hint { display: none; }
    #stats { left: clamp(16px, 3.4vw, 34px); text-align: left; }
    .btn { padding: 7px 11px; font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="glow"></div>
<div id="vignette"></div>

<header class="hud" id="brand">
  <h1>心 动</h1>
  <div class="en">Heartbeat · a three.js particle heart</div>
</header>

<nav class="hud" id="actions">
  <button class="btn" id="btn-audio" title="心跳声">♪ 音效</button>
  <button class="btn" id="btn-palette" title="切换配色">✦ 配色</button>
  <button class="btn" id="btn-full" title="全屏">⛶ 全屏</button>
</nav>

<div class="hud" id="hint"><b>拖动</b> 旋转 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>单击</b> 让它怦然加速</div>

<div class="hud" id="stats">
  <div class="love">♥ 已心动 <span class="n" id="love-n">0</span> 次</div>
  <div class="meta" id="meta">— particles · — fps</div>
</div>

<div id="fallback">这个作品需要支持 WebGL 的浏览器<br>推荐 Chrome / Edge / Safari 最新版</div>

<script type="module" src="./assets/heart.js"></script>
</body>
</html>
