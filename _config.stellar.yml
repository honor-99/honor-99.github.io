# Stellar 主题覆盖配置（其余保持主题默认值）
# 文档: https://xaoxuu.com/wiki/stellar/

leftbar:
  brand:
    ghuser: honor-99
    tagline: 学无止境
    image:
      src: /images/github-avatar-240.png
      variant: avatar
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/


article:
  style: tech
  show_reading_time: true
  related_posts_limit: 0
  category_colors:
    AI 技术: '#6f42c1'
    技术笔记: '#0366d6'

footer:
  sitemap:
    - title: 博客
      items:
        - '[近期发布](/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 站点
      items:
        - '[关于](/about/)'
        - '[RSS 订阅](/atom.xml)'
        - '[GitHub](https://github.com/honor-99)'

features:
  color_scheme_switch:
    enabled: true

inject:
  head_end: |
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261026">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261026">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261026">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261026">
    <link rel="manifest" href="/site.webmanifest?v=20261026">
    <meta name="msapplication-TileColor" content="#f9fafb">
    <meta name="msapplication-config" content="/browserconfig.xml">
    <meta property="og:image" content="https://208202.xyz/images/social-preview.png?v=20261026">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:image" content="https://208202.xyz/images/social-preview.png?v=20261026">
    <meta name="twitter:card" content="summary_large_image">
  body_end: '<script src="/js/theme-toggle.js" defer></script>'
